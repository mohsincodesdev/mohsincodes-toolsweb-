<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; text-align: center; }
        .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 20px; }
        button { padding: 10px 15px; background: #333; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #00d2ff; }
        .tool-box { display: none; background: #1c222d; padding: 20px; max-width: 400px; margin: 20px auto; border-radius: 10px; }
        .active { display: block; }
    </style>
</head>
<body>
    <h1>MohsinCodes Utility Hub</h1>
    
    <!-- Menu Bar -->
    <div class="menu" id="menuBar"></div>

    <!-- Content Area -->
    <div id="contentArea"></div>

    <script>
        const tools = [
            { id: 'emi', name: 'EMI Calc', inputs: ['Principal', 'Rate', 'Years'], formula: (p,r,n) => (p * (r/1200) * Math.pow(1 + r/1200, n*12)) / (Math.pow(1 + r/1200, n*12) - 1) },
            { id: 'discount', name: 'Discount Calc', inputs: ['Price', 'Discount%'], formula: (p,d) => p - (p * d / 100) },
            { id: 'word', name: 'Word Counter', inputs: ['Text'], formula: (t) => t.split(' ').filter(x=>x).length }
        ];

        function init() {
            const menuBar = document.getElementById('menuBar');
            const contentArea = document.getElementById('contentArea');

            tools.forEach(t => {
                // Create Button
                menuBar.innerHTML += `<button onclick="show('${t.id}')">${t.name}</button>`;
                
                // Create Tool Box
                contentArea.innerHTML += `
                    <div id="${t.id}Box" class="tool-box">
                        <h3>${t.name}</h3>
                        ${t.inputs.map(i => `<input type="number" id="${t.id}${i}" placeholder="${i}"><br>`).join('')}
                        <button onclick="calc('${t.id}')">Calculate</button>
                        <p id="${t.id}Res"></p>
                    </div>`;
            });
        }

        function show(id) {
            document.querySelectorAll('.tool-box').forEach(t => t.style.display = 'none');
            document.getElementById(id + 'Box').style.display = 'block';
        }

        function calc(id) {
            const tool = tools.find(t => t.id === id);
            const vals = tool.inputs.map(i => parseFloat(document.getElementById(id + i).value));
            document.getElementById(id + 'Res').innerText = "Result: " + tool.formula(...vals).toFixed(2);
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MohsinCodes Hub</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; text-align: center; }
        .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 20px; }
        button { padding: 8px 12px; background: #333; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #00d2ff; }
        .tool-box { display: none; background: #1c222d; padding: 25px; max-width: 400px; margin: 20px auto; border-radius: 12px; border: 1px solid #444; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <h1>MohsinCodes Utility Hub</h1>
    <div class="menu" id="menuBar"></div>
    <div id="contentArea"></div>

    <script>
            const tools = [
            // Batch 1 (Finance)
            { id: 'emi', name: 'EMI Calc', inputs: ['Principal', 'Rate', 'Years'], formula: (p,r,n) => (p*(r/1200)*Math.pow(1+r/1200, n*12))/(Math.pow(1+r/1200, n*12)-1) },
            { id: 'simpleInt', name: 'Simple Interest', inputs: ['Principal', 'Rate', 'Years'], formula: (p,r,t) => (p * r * t) / 100 },
            { id: 'discount', name: 'Discount Calc', inputs: ['Price', 'Discount%'], formula: (p,d) => p - (p * d / 100) },
            { id: 'gst', name: 'GST Calculator', inputs: ['Amount', 'GST%'], formula: (a,g) => a * (g / 100) },
            { id: 'margin', name: 'Margin Calc', inputs: ['Cost', 'Revenue'], formula: (c,r) => ((r - c) / r) * 100 },
            { id: 'profit', name: 'Profit Calc', inputs: ['Cost', 'SalePrice'], formula: (c,s) => s - c },
            { id: 'tax', name: 'Tax Calculator', inputs: ['Income', 'Tax%'], formula: (i,t) => i * (t / 100) },
            { id: 'savings', name: 'Savings Goal', inputs: ['Target', 'Current'], formula: (t,c) => t - c },
            { id: 'tip', name: 'Tip Calculator', inputs: ['Bill', 'Tip%'], formula: (b,t) => b * (t / 100) },
            { id: 'roi', name: 'ROI Calculator', inputs: ['Gain', 'Cost'], formula: (g,c) => ((g - c) / c) * 100 },
            
            // Batch 2 (Text & SEO)
            { id: 'word', name: 'Word Count', inputs: ['Text'], formula: (t) => t.split(/\s+/).filter(x=>x).length },
            { id: 'char', name: 'Char Count', inputs: ['Text'], formula: (t) => t.length },
            { id: 'upper', name: 'UPPERCASE', inputs: ['Text'], formula: (t) => t.toUpperCase() },
            { id: 'lower', name: 'lowercase', inputs: ['Text'], formula: (t) => t.toLowerCase() },
            { id: 'reverse', name: 'Text Reverse', inputs: ['Text'], formula: (t) => t.split('').reverse().join('') },
            { id: 'slug', name: 'Slug Gen', inputs: ['Text'], formula: (t) => t.toLowerCase().replace(/[^a-z0-9]+/g, '-') },
            { id: 'removeSpace', name: 'Remove Spaces', inputs: ['Text'], formula: (t) => t.replace(/\s+/g, '') },
            { id: 'readTime', name: 'Read Time', inputs: ['Text'], formula: (t) => Math.ceil(t.split(' ').length / 200) + ' min' },
            { id: 'base64Enc', name: 'Base64 Enc', inputs: ['Text'], formula: (t) => btoa(t) },
            { id: 'base64Dec', name: 'Base64 Dec', inputs: ['Text'], formula: (t) => atob(t) },

            // Batch 3 (Developer Tools)
            { id: 'jsonValid', name: 'JSON Validator', inputs: ['JSON'], formula: (t) => { try { JSON.parse(t); return "Valid JSON ✅"; } catch(e) { return "Invalid JSON ❌"; } } },
            { id: 'urlEnc', name: 'URL Encode', inputs: ['URL'], formula: (t) => encodeURIComponent(t) },
            { id: 'urlDec', name: 'URL Decode', inputs: ['URL'], formula: (t) => decodeURIComponent(t) },
            { id: 'passGen', name: 'Pass Generator', inputs: ['Length'], formula: (l) => Math.random().toString(36).substring(2, 2+parseInt(l)) },
            { id: 'binDec', name: 'Bin to Dec', inputs: ['Binary'], formula: (t) => parseInt(t, 2) },
            { id: 'decBin', name: 'Dec to Bin', inputs: ['Decimal'], formula: (t) => parseInt(t).toString(2) },
            { id: 'hexRgb', name: 'Hex to RGB', inputs: ['Hex'], formula: (t) => { let r=parseInt(t.slice(1,3),16), g=parseInt(t.slice(3,5),16), b=parseInt(t.slice(5,7),16); return `rgb(${r},${g},${b})`; } },
            { id: 'unix', name: 'Current Unix', inputs: ['Click'], formula: () => Math.floor(Date.now() / 1000) },
            { id: 'randomNum', name: 'Random Number', inputs: ['Min', 'Max'], formula: (min,max) => Math.floor(Math.random() * (max - min + 1)) + parseInt(min) },
            { id: 'jsMin', name: 'Simple JS Min', inputs: ['Code'], formula: (t) => t.replace(/\s+/g, ' ').trim() },

            // Batch 4 (Math, Conversion & Health)
            { id: 'celsiusF', name: 'C to F', inputs: ['Celsius'], formula: (c) => (c * 9/5) + 32 },
            { id: 'kgLbs', name: 'KG to LBS', inputs: ['KG'], formula: (k) => k * 2.20462 },
            { id: 'cmInch', name: 'CM to Inch', inputs: ['CM'], formula: (c) => c / 2.54 },
            { id: 'bmi', name: 'BMI Calc', inputs: ['Weight(kg)', 'Height(m)'], formula: (w,h) => (w / (h * h)).toFixed(1) },
            { id: 'feetM', name: 'Feet to M', inputs: ['Feet'], formula: (f) => f * 0.3048 },
            { id: 'pct', name: 'Percentage', inputs: ['Value', 'Total'], formula: (v,t) => (v / t) * 100 + '%' },
            { id: 'age', name: 'Age Calc', inputs: ['BirthYear'], formula: (y) => new Date().getFullYear() - y },
            { id: 'circle', name: 'Circle Area', inputs: ['Radius'], formula: (r) => Math.PI * r * r },
            { id: 'sqRoot', name: 'Square Root', inputs: ['Number'], formula: (n) => Math.sqrt(n) },
            { id: 'kmMile', name: 'KM to Mile', inputs: ['KM'], formula: (k) => k * 0.621371 },

            // Batch 5 (General Utilities)
            { id: 'randName', name: 'Rand Name', inputs: ['Prefix'], formula: (p) => p + Math.floor(Math.random()*1000) },
            { id: 'time', name: 'Current Time', inputs: ['Click'], formula: () => new Date().toLocaleTimeString() },
            { id: 'date', name: 'Current Date', inputs: ['Click'], formula: () => new Date().toLocaleDateString() },
            { id: 'daysUntil', name: 'Days til 2027', inputs: ['Click'], formula: () => Math.ceil((new Date('2027-01-01') - new Date()) / (1000*60*60*24)) },
            { id: 'vowels', name: 'Vowel Count', inputs: ['Text'], formula: (t) => (t.match(/[aeiou]/gi) || []).length },
            { id: 'lines', name: 'Line Count', inputs: ['Text'], formula: (t) => t.split('\n').length },
            { id: 'upperSnake', name: 'UPPER_SNAKE', inputs: ['Text'], formula: (t) => t.toUpperCase().replace(/\s+/g, '_') },
            { id: 'randomHex', name: 'Random Hex', inputs: ['Click'], formula: () => '#'+Math.floor(Math.random()*16777215).toString(16) },
            { id: 'repeat', name: 'Repeat Text', inputs: ['Text', 'Times'], formula: (t,n) => t.repeat(n) },
            { id: 'ascii', name: 'Char to ASCII', inputs: ['Char'], formula: (c) => c.charCodeAt(0) }
        
        ];

        function init() {
            const menuBar = document.getElementById('menuBar');
            const contentArea = document.getElementById('contentArea');
            tools.forEach(t => {
                menuBar.innerHTML += `<button onclick="show('${t.id}')">${t.name}</button>`;
                // Textarea handled for word count specifically
                const inputsHtml = t.inputs.map(i => i === 'Text' ? `<textarea id="${t.id}${i}" placeholder="${i}"></textarea>` : `<input type="number" id="${t.id}${i}" placeholder="${i}">`).join('');
                
                contentArea.innerHTML += `
                    <div id="${t.id}Box" class="tool-box">
                        <h3>${t.name}</h3>
                        ${inputsHtml}
                        <button onclick="calc('${t.id}')">Calculate / Run</button>
                        <p id="${t.id}Res" style="margin-top:15px; color:#00d2ff;"></p>
                    </div>`;
            });
        }

        function show(id) {
            document.querySelectorAll('.tool-box').forEach(t => t.style.display = 'none');
            document.getElementById(id + 'Box').style.display = 'block';
        }

        function calc(id) {
            const tool = tools.find(t => t.id === id);
            const vals = tool.inputs.map(i => document.getElementById(id + i).value);
            document.getElementById(id + 'Res').innerText = "Result: " + tool.formula(...vals);
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MohsinCodes Hub</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; text-align: center; }
        .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 20px; }
        button { padding: 8px 12px; background: #333; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #00d2ff; }
        .tool-box { display: none; background: #1c222d; padding: 25px; max-width: 400px; margin: 20px auto; border-radius: 12px; border: 1px solid #444; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
    </style>
</head>
<body>
    <h1>MohsinCodes Utility Hub</h1>
    <div class="menu" id="menuBar"></div>
    <div id="contentArea"></div>

    <script>
        // Yahan aapko tools add karne hain (Bas yahan copy-paste karein)
        const tools = [
            { id: 'emi', name: 'EMI Calc', inputs: ['Principal', 'Rate', 'Years'], formula: (p,r,n) => (p*(r/1200)*Math.pow(1+r/1200, n*12))/(Math.pow(1+r/1200, n*12)-1) },
            { id: 'simpleInt', name: 'Simple Interest', inputs: ['Principal', 'Rate', 'Years'], formula: (p,r,t) => (p * r * t) / 100 },
            { id: 'discount', name: 'Discount Calc', inputs: ['Price', 'Discount%'], formula: (p,d) => p - (p * d / 100) },
            { id: 'gst', name: 'GST Calculator', inputs: ['Amount', 'GST%'], formula: (a,g) => a * (g / 100) },
            { id: 'margin', name: 'Margin Calc', inputs: ['Cost', 'Revenue'], formula: (c,r) => ((r - c) / r) * 100 },
            { id: 'profit', name: 'Profit Calc', inputs: ['Cost', 'SalePrice'], formula: (c,s) => s - c },
            { id: 'tax', name: 'Tax Calculator', inputs: ['Income', 'Tax%'], formula: (i,t) => i * (t / 100) },
            { id: 'savings', name: 'Savings Goal', inputs: ['Target', 'Current'], formula: (t,c) => t - c },
            { id: 'tip', name: 'Tip Calculator', inputs: ['Bill', 'Tip%'], formula: (b,t) => b * (t / 100) },
            { id: 'roi', name: 'ROI Calculator', inputs: ['Gain', 'Cost'], formula: (g,c) => ((g - c) / c) * 100 }
            { id: 'word', name: 'Word Count', inputs: ['Text'], formula: (t) => t.split(' ').filter(x=>x).length }
        ];

        function init() {
            const menuBar = document.getElementById('menuBar');
            const contentArea = document.getElementById('contentArea');
            tools.forEach(t => {
                menuBar.innerHTML += `<button onclick="show('${t.id}')">${t.name}</button>`;
                contentArea.innerHTML += `
                    <div id="${t.id}Box" class="tool-box">
                        <h3>${t.name}</h3>
                        ${t.inputs.map(i => `<input id="${t.id}${i}" placeholder="${i}">`).join('')}
                        <button onclick="calc('${t.id}')">Calculate / Run</button>
                        <p id="${t.id}Res" style="margin-top:15px; color:#00d2ff;"></p>
                    </div>`;
            });
        }

        function show(id) {
            document.querySelectorAll('.tool-box').forEach(t => t.style.display = 'none');
            document.getElementById(id + 'Box').style.display = 'block';
        }

        function calc(id) {
            const tool = tools.find(t => t.id === id);
            const vals = tool.inputs.map(i => document.getElementById(id + i).value);
            document.getElementById(id + 'Res').innerText = "Result: " + tool.formula(...vals);
        }

        init();
    </script>
</body>
</html>
